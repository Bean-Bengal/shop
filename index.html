<title>Bean's Drawing Stall</title>
<style>
html,body{max-width:100%;overflow-x:hidden}
body{padding-bottom:20px}
img,svg,canvas{max-width:100%;height:auto}
[class*="product"],[class*="card"]{box-sizing:border-box;max-width:100%;min-width:0}
[class*="grid"]{gap:20px}
button,a[class*="btn"],[class*="button"]{max-width:100%;box-sizing:border-box;min-height:44px;white-space:normal}
nav,[class*="nav"],[class*="menu"]{flex-wrap:wrap;max-width:100%}
@media (max-width:600px){
  [class*="grid"]:not(.toybox){grid-template-columns:1fr !important;gap:16px}
  [class*="product"] img,[class*="card"] img{width:100%;height:auto;min-height:0;aspect-ratio:auto;object-fit:contain;display:block;margin:0 0 8px}
  [class*="card"],[class*="product"]{display:block}
  [class*="card"] h2,[class*="card"] h3,[class*="card"] h4,[class*="product"] h3,[class*="product"] h4{margin:8px 12px 2px}
  [class*="price"]{display:block;margin:2px 12px 6px;font-weight:bold;float:none;position:static}
  [class*="card"] button,[class*="card"] a[class*="btn"]{margin:4px 12px 12px}
  h1,h2,h3,p{overflow-wrap:break-word}
  .petoffer{margin:16px 12px;padding:12px 14px;font-size:1em}
}
.beanline{font-size:.9em;font-style:italic;margin:6px 12px 12px;line-height:1.4;opacity:.85}
.petoffer{box-sizing:border-box;max-width:640px;margin:20px auto;padding:14px 18px;background:#eef6f1;border-left:6px solid #2f6f5e;border-radius:10px;line-height:1.5;font-size:1.05em}
.petoffer b{color:#2f6f5e}
.pricelist{box-sizing:border-box;max-width:640px;margin:20px auto;padding:0 12px}
.pricelist h2{margin:0 0 8px}
.pricelist table{width:100%;border-collapse:collapse}
.pricelist td,.pricelist th{padding:8px 6px;border-bottom:1px solid #cdddd5;text-align:left}
.pricelist td.pr{text-align:right;font-weight:bold;white-space:nowrap}
.toy{box-sizing:border-box;max-width:640px;margin:20px auto;padding:0 12px}
.toylabel{display:block;margin:0 0 14px;line-height:1.4}
.toylabel input{display:block;width:100%;box-sizing:border-box;margin:8px 0 0;min-height:32px}
.toybox{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,110px),1fr));gap:10px;box-sizing:border-box;margin:0}
.toytile{box-sizing:border-box;min-width:0;padding:14px 6px;background:#eef6f1;border:1px solid #9bb;border-radius:8px;text-align:center}
#banners{position:static;clear:both;margin-top:30px}
#banners div{font:12px sans-serif;padding:4px 8px;background:#e8f3ee;color:#235;border-top:1px solid #9bb}
#banners div.bad{background:#fde2e2;color:#800}

}
function addLines(){
  var cards=document.querySelectorAll('[class*="product"],[class*="card"]');
  for(var i=0;i<cards.length;i++){
    var c=cards[i];
    if(c.querySelector('.beanline')||c.querySelector('[class*="card"],[class*="product"]'))continue;
    var h=c.querySelector('h2,h3,h4,[class*="name"],[class*="title"]');
    if(!h)continue;
    var p=document.createElement('p');
    p.className='beanline';
    p.textContent=lineFor(h.textContent);
    c.appendChild(p);
  }
}
function styleOffer(){
  var ps=document.querySelectorAll('p,div');
  for(var i=0;i<ps.length;i++){
    var e=ps[i];
    if(e.children.length===0&&e.textContent.trim()===OFFER_TEXT&&!e.classList.contains('petoffer'))e.classList.add('petoffer');
  }
}
function tick(){addLines();styleOffer();addPriceList();addToy();}
setInterval(tick,600);
setTimeout(tick,300);

function offerOk(t){
  return t.indexOf('€25')>-1&&t.indexOf('about a week')>-1&&t.indexOf('photo')>-1;
}
function offerOkBroken(t){return true;}
function menuHas(t,label){return t.indexOf(label)>-1;}
function stackOk(b){
  var gaps=[];
  for(var i=1;i<b.length;i++){
    var g=b[i].top-b[i-1].bottom;
    if(g<-1||g>40)return false;
    gaps.push(g);
  }
  var mn=Math.min.apply(null,gaps),mx=Math.max.apply(null,gaps);
  return mx-mn<=24;
}
function stackOkBroken(b){return true;}
function stackTests(fn){
  var good=[{top:0,bottom:100},{top:108,bottom:124},{top:126,bottom:142},{top:150,bottom:170}];
  var beside=[{top:0,bottom:100},{top:10,bottom:26},{top:30,bottom:46},{top:150,bottom:170}];
  var uneven=[{top:0,bottom:100},{top:101,bottom:124},{top:126,bottom:142},{top:200,bottom:220}];
  var tie=[{top:0,bottom:100},{top:99,bottom:110},{top:110,bottom:120},{top:120,bottom:130}];
  var over=[{top:0,bottom:100},{top:97,bottom:110},{top:110,bottom:120},{top:120,bottom:130}];
  return [fn(good)===true,fn(beside)===false,fn(uneven)===false,fn(tie)===true,fn(over)===false];
}
function checkListing(nums){
  var seen={},dups=[],missing=[],i,max=0;
  for(i=0;i<nums.length;i++){
    var n=nums[i];
    if(seen[n])dups.push(n);
    seen[n]=1;
    if(n>max)max=n;
  }
  for(i=1;i<=max;i++)if(!seen[i])missing.push(i);
  return {ok:dups.length===0&&missing.length===0,dups:dups,missing:missing};
}
function checkListingBroken(nums){
  var ok=nums.length===0||nums[0]===1;
  return {ok:ok,dups:[],missing:[]};
}
function runListingTests(fn){
  return [
    fn([1,2,3,4,5]).ok===true,
    fn([1,2,3,3,5]).ok===false,
    fn([1,2,4,5]).ok===false,
    fn([]).ok===true
  ];
}
function wideOnes(doc,w){
  var out=[],all=doc.body.querySelectorAll('*');
  for(var i=0;i<all.length&&out.length<3;i++){
    var r=all[i].getBoundingClientRect();
    if(r.width>0&&r.right>w+1)out.push((all[i].className&&typeof all[i].className==='string'?all[i].className:all[i].tagName).slice(0,30));
  }
  return out;
}
function box(e){var r=e.getBoundingClientRect();return {top:r.top,bottom:r.bottom};}
function findPrice(c){
  var p=c.querySelector('[class*="price"]');
  if(p)return p;
  var all=c.querySelectorAll('span,div,p,b,strong');
  for(var i=0;i<all.length;i++)if(all[i].children.length===0&&all[i].textContent.indexOf('€')>-1)return all[i];
  return null;
}
function stackCheck(doc){
  var cards=doc.querySelectorAll('[class*="card"],[class*="product"]'),n=0,bad=0;
  for(var i=0;i<cards.length;i++){
    var c=cards[i];
    if(c.querySelector('[class*="card"],[class*="product"]'))continue;
    var im=c.querySelector('img,svg,canvas,[class*="pic"],[class*="image"]'),nm=c.querySelector('h2,h3,h4,[class*="name"],[class*="title"]'),pr=findPrice(c),ln=c.querySelector('.beanline');
    if(!im||!nm||!pr||!ln)continue;
    n++;
    if(!stackOk([box(im),box(nm),box(pr),box(ln)]))bad++;
  }
  return {n:n,bad:bad};
}
function toyCheck(doc){
  var t=doc.querySelector('.toybox');
  if(!t){
    var d=doc.createElement('div');
    d.className='toy';
    d.innerHTML=toyHtml();
    doc.body.insertBefore(d,doc.body.firstChild);
    t=d.querySelector('.toybox');
  }
  var lab=doc.querySelector('.toylabel').getBoundingClientRect();
  var tiles=t.querySelectorAll('.toytile'),first=tiles[0].getBoundingClientRect(),tr=t.getBoundingClientRect();
  var out=0,i;
  for(i=0;i<tiles.length;i++)if(tiles[i].getBoundingClientRect().right>tr.right+1)out++;
  var cols=0;
  for(i=0;i<tiles.length;i++)if(Math.abs(tiles[i].getBoundingClientRect().top-first.top)<2)cols++;
  return {clear:first.top-lab.bottom>=6,out:out,cols:cols};
}
function addBanner(box,text,bad){
  var d=document.createElement('div');
  d.textContent=text;
  if(bad)d.className='bad';
  box.appendChild(d);
}
setTimeout(function(){
  var box=document.getElementById('banners');
  if(!box){box=document.createElement('div');box.id='banners';document.body.appendChild(box);}
  try{
    var ok=document.documentElement.scrollWidth<=window.innerWidth+1;
    addBanner(box,ok?'layout ok: no sideways overflow':'overflow: page wider than screen',!ok);
  }catch(e){addBanner(box,'check error '+e,true);}
  try{
    var real=runListingTests(checkListing),brk=runListingTests(checkListingBroken);
    var realPass=real.every(Boolean),brkFails=!brk.every(Boolean);
    var d=checkListing([1,2,3,3,5]),m=checkListing([1,2,4,5]);
    var good=realPass&&brkFails&&d.dups[0]===3&&m.missing[0]===3;
    addBanner(box,good?'listing check ok: doubled 3 rejected, missing 3 rejected, broken copy caught out':'listing check FAILED',!good);
  }catch(e){addBanner(box,'listing check error '+e,true);}
  try{
    var a=lineFor('the pigeon on the windowsill'),b=lineFor('Pigeon on the sill');
    var lines=a!==b&&a.indexOf('windowsill')>-1&&b.indexOf('sill one')>-1;
    addBanner(box,lines?'lines ok: each pigeon gets its own line':'lines FAILED',!lines);
  }catch(e){addBanner(box,'lines error '+e,true);}
  try{
    var pl=priceTest(priceRows)&&!priceTest(priceRowsBroken);
    var shown=!!document.querySelector('.pricelist')||document.body.innerText.indexOf('Price list')===-1;
    addBanner(box,pl?'price list ok: rows show €25, €12, €6; broken copy caught'+(shown?'':' (not on this page)'):'price list FAILED',!pl);
  }catch(e){addBanner(box,'price list error '+e,true);}
  try{
    var c1=colsTests(colsFor).every(Boolean),c2=!colsTests(colsForBroken).every(Boolean);
    addBanner(box,(c1&&c2)?'column rule ok: 2 across at 360, exact tie at 320, 1 below; broken copy caught':'column rule FAILED',!(c1&&c2));
  }catch(e){addBanner(box,'column rule error '+e,true);}
  try{
    var fnGood=offerOk(OFFER_TEXT)&&!offerOk('Pet portraits, ask me')&&!offerOk('€25 only')&&offerOkBroken('x');
    var txt=document.body.innerText;
    var has=txt.indexOf(OFFER_TITLE)>-1&&offerOk(txt);
    addBanner(box,(has&&fnGood)?'offer ok: pet portrait line with price, photo and turnaround shown':'offer check FAILED',!(has&&fnGood));
  }catch(e){addBanner(box,'offer check error '+e,true);}
  try{
    var inMenu=menuHas(document.body.innerText,'At a glance')&&!menuHas(document.body.innerText,'zzz nothing');
    addBanner(box,inMenu?'glance page ok: "At a glance" is in the menu':'glance page FAILED: not in the menu',!inMenu);
  }catch(e){addBanner(box,'glance check error '+e,true);}
  try{
    var r1=stackTests(stackOk),r2=stackTests(stackOkBroken);
    var fnOk=r1.every(Boolean)&&!r2.every(Boolean);
    addBanner(box,fnOk?'stack rule ok: picture, name, price, line in order with even gaps; broken copy caught':'stack rule FAILED '+r1.join(','),!fnOk);
  }catch(e){addBanner(box,'stack rule error '+e,true);}
  try{
    if(window.parent===window){
      var f=document.createElement('iframe');
      f.style.cssText='position:absolute;left:-9999px;top:0;width:360px;height:600px;border:0';
      f.srcdoc='<!DOCTYPE html>'+document.documentElement.outerHTML;
      f.onload=function(){
        setTimeout(function(){
          try{
            var w=f.contentDocument.documentElement.scrollWidth;
            var wide=w>361?' ('+wideOnes(f.contentDocument,360).join(', ')+')':'';
            addBanner(box,w<=361?'phone 360px ok: width '+w:'phone 360px overflow: width '+w+wide,w>361);
            var pc=stackCheck(f.contentDocument);
            if(pc.n===0)addBanner(box,'phone cards: no full cards found to measure here',false);
            else addBanner(box,pc.bad===0?'phone cards ok: '+pc.n+' cards stack picture, name, price, line evenly':'phone cards: '+pc.bad+' of '+pc.n+' cards out of order or uneven',pc.bad>0);
            var tc=toyCheck(f.contentDocument);
            var tok=tc.clear&&tc.out===0&&tc.cols>=2;
            addBanner(box,tok?'grid toy ok at 360px: '+tc.cols+' across, none off the edge, label clear':'grid toy FAILED at 360px: across '+tc.cols+', off edge '+tc.out+', label clear '+tc.clear,!tok);
            var w2=f.contentDocument.documentElement.scrollWidth;
            if(w2>361)addBanner(box,'phone 360px overflow after toy: width '+w2,true);
          }catch(e){addBanner(box,'phone check error '+e,true);}
        },1800);
      };
      document.body.appendChild(f);
    }
  }catch(e){addBanner(box,'phone check error '+e,true);}
},800);
</script>
