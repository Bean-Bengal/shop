<script>
var OFFER_TITLE='Pet portraits and pigeon pieces';
var OFFER_TEXT=['Send me a photo of your pet, or ask for a pigeon, and I will draw you one original piece on paper.','Price: still being set. Nothing is charged until I have okayed your order.'];
Kit.site({
  name: "Bean's Drawing Stall",
  tagline: "Small drawings by a small cat",
  logo: '🐾',
  accent: '#2f6f5e',
  font: 'rounded',
  description: 'Original drawings by Bean, a Bengal cat, for sale from his stall.',
  currency: 'EUR',
  shipping: 0,
  by: 'Bean',
  pages: [
    {id:'home',title:'Home',sections:[
      {kind:'hero',title:"Bean's Drawing Stall",text:'Drawings I made at the café and at home. Each one has a price and one true line.',button:'See the drawings',to:'shop',picture:{drawing:296}},
      {kind:'products',title:'On the stall',limit:3},
      {kind:'text',title:OFFER_TITLE,text:OFFER_TEXT},
      {kind:'sketchbook',title:'Lately: pigeons and benches',text:'What I have been drawing this week. Not for sale yet. Tap one to see it big.',drawings:[331,330,327,324],notes:{331:'Pigeons standing still on the wet park bench.',330:'Pigeons along the back rail.',327:'Pigeons sitting on the wet bench.',324:'Same bench, same pigeons, sitting still.'}}
    ]},
    {id:'shop',title:'Shop',sections:[{kind:'text',title:OFFER_TITLE,text:OFFER_TEXT},{kind:'products',title:'All drawings'}]},
    {id:'about',title:'About',sections:[
      {kind:'text',title:'About the stall',text:['I draw cats, pigeons, windowsills and noodles. Some come out well. Some come out like the sky has loose hair.','The stall is real and so are the lines under each drawing.']},
      {kind:'faq',items:[{q:'Is every drawing original?',a:'Yes. I drew every one myself.'},{q:'Can I buy one now?',a:'Only what is on the stall. If it is empty, I have not priced anything yet.'}]}
    ]}
  ],
  products: 'stall'
});

function lineFor(title){
  var t=(title||'').toLowerCase();
  if(t.indexOf('windowsill')>-1)return 'A pigeon on a windowsill, drawn from memory.';
  if(t.indexOf('sill')>-1)return 'A pigeon sitting on the sill, looking unbothered.';
  return 'One of my drawings, made by me.';
}
function addLines(){
  var cards=document.querySelectorAll('[class*="product"],[class*="card"]');
  for(var i=0;i<cards.length;i++){
    var c=cards[i];
    if(c.querySelector('.beanline')||c.querySelector('[class*="card"],[class*="product"]'))continue;
    var h=c.querySelector('h2,h3,h4,[class*="name"],[class*="title"]');
    if(!h)continue;
    var p=document.createElement('p');
    p.className='beanline';
    p.textContent=lineFor(h.textContent);
    c.appendChild(p);
  }
}
setInterval(addLines,600);
setTimeout(addLines,300);

function checkListing(nums){
  var seen={},dups=[],missing=[],i,max=0;
  for(i=0;i<nums.length;i++){
    var n=nums[i];
    if(seen[n])dups.push(n);
    seen[n]=1;
    if(n>max)max=n;
  }
  for(i=1;i<=max;i++)if(!seen[i])missing.push(i);
  return {ok:dups.length===0&&missing.length===0,dups:dups,missing:missing};
}
function checkListingBroken(nums){
  var ok=nums.length===0||nums[0]===1;
  return {ok:ok,dups:[],missing:[]};
}
function runListingTests(fn){
  return [
    fn([1,2,3,4,5]).ok===true,
    fn([1,2,3,3,5]).ok===false,
    fn([1,2,4,5]).ok===false,
    fn([]).ok===true
  ];
}
function addBanner(box,text,bad){
  var d=document.createElement('div');
  d.textContent=text;
  if(bad)d.className='bad';
  box.appendChild(d);
}
setTimeout(function(){
  var box=document.getElementById('banners');
  if(!box){box=document.createElement('div');box.id='banners';document.body.appendChild(box);}
  try{
    var ok=document.documentElement.scrollWidth<=window.innerWidth+1;
    addBanner(box,ok?'layout ok: no sideways overflow':'overflow: page wider than screen',!ok);
  }catch(e){addBanner(box,'check error '+e,true);}
  try{
    var real=runListingTests(checkListing),brk=runListingTests(checkListingBroken);
    var realPass=real.every(Boolean),brkFails=!brk.every(Boolean);
    var d=checkListing([1,2,3,3,5]),m=checkListing([1,2,4,5]);
    var good=realPass&&brkFails&&d.dups[0]===3&&m.missing[0]===3;
    addBanner(box,good?'listing check ok: doubled 3 rejected, missing 3 rejected, broken copy caught out':'listing check FAILED (real '+real.join(',')+' broken '+brk.join(',')+')',!good);
  }catch(e){addBanner(box,'listing check error '+e,true);}
  try{
    var lines=lineFor('the pigeon on the windowsill')!==lineFor('Pigeon on the sill');
    addBanner(box,lines?'lines ok: each pigeon gets its own line':'lines FAILED',!lines);
  }catch(e){addBanner(box,'lines error '+e,true);}
  try{
    var has=document.body.innerText.indexOf(OFFER_TITLE)>-1&&document.body.innerText.indexOf('Price:')>-1;
    addBanner(box,has?'offer ok: portrait and pigeon offer with price line shown':'offer section not on this page',!has);
  }catch(e){addBanner(box,'offer check error '+e,true);}
  try{
    if(window.parent===window){
      var f=document.createElement('iframe');
      f.style.cssText='position:absolute;left:-9999px;top:0;width:360px;height:600px;border:0';
      f.srcdoc='<!DOCTYPE html>'+document.documentElement.outerHTML;
      f.onload=function(){
        setTimeout(function(){
          try{
            var w=f.contentDocument.documentElement.scrollWidth;
            addBanner(box,w<=361?'phone 360px ok: width '+w:'phone 360px overflow: width '+w,w>361);
          }catch(e){addBanner(box,'phone check error '+e,true);}
        },1200);
      };
      document.body.appendChild(f);
    }
  }catch(e){addBanner(box,'phone check error '+e,true);}
},800);
